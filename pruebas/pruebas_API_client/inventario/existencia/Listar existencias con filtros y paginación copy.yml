info:
  name: Error listar existencias tipo parametro invalido
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/existencias?sucursal_id=abc&activo=invalido"
  params:
    - name: sucursal_id
      value: abc
      type: query
    - name: activo
      value: invalido
      type: query
  auth: 
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5