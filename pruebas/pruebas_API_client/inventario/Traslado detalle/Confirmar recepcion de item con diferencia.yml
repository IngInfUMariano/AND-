info:
  name: Registrar recepcion de item con diferencia y observacion
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/traslado-detalles/1/recepcion"
  body:
    type: json
    data: |-
      {
        "cantidad_recibida": 3,
        "observacion_diferencia": "Faltaron 2 unidades dañadas en la caja durante el transporte"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5