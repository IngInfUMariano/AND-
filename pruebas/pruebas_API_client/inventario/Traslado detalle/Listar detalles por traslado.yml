info:
  name: Listar detalles por traslado
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/traslado-detalles?traslado_id=1"
  params:
    - name: traslado_id
      value: "1"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
