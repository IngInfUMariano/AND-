info:
  name: Crear intencion de pago
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}api/pagos/intencion"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "pedido_id": 1
      }
  auth:
    type: bearer
    token: "{{token_tienda}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
