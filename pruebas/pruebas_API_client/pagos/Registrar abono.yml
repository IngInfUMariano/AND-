info:
  name: Registrar abono
  type: http
  seq: 16

http:
  method: POST
  url: "{{base_url}}api/clientes/2/abonos"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "monto": 500.00,
        "referencia": "Transferencia banco industrial ref-00123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
