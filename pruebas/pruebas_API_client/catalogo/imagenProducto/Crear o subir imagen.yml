info:
  name: Crear o subir imagen
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/imagen-productos"
  body:
    type: json
    data: |-
      {
        "producto_id": 2,
        "color_id": 2,
        "url": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIVTdErvGSUzBOE9Gtw8ak2a5bB916WLRpovU3i18P6prVMV460BYdDWEn&s=10",
        "orden": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
