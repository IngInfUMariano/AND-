info:
  name: Actualizar orden o color de la imagen
  type: http
  seq: 1

http:
  method: PUT
  url: "{{base_url}}/imagen-productos/1"
  body:
    type: json
    data: |-
      {
        "orden": 2,
        "color_id": 2
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
