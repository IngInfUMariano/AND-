info:
  name: Crear categoria raiz
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/categorias"
  body:
    type: json
    data: |-
      {
        "nombre": "Verano",
        "descripcion": "Ropa de verano, lentes y accesorios"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
