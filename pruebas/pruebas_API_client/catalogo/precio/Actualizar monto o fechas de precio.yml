info:
  name: Actualizar monto o fechas de precio
  type: http
  seq: 1

http:
  method: PUT
  url: "{{base_url}}/precios/1"
  body:
    type: json
    data: |-
      {
        "monto": 280.00
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
