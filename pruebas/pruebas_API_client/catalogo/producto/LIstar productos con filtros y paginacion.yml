info:
  name: LIstar productos con filtros y paginacion
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/productos?genero=HOMBRE&categoria_id=1&activo=true&q=Polo"
  params:
    - name: genero
      value: HOMBRE
      type: query
    - name: categoria_id
      value: "1"
      type: query
    - name: activo
      value: "true"
      type: query
    - name: q
      value: Polo
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
