info:
  name: Crear color
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/colores"
  body:
    type: json
    data: |-
      {
        "nombre": "Azul Turquesa",
        "codigo_hex": "#40E0D0"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: base_url
      value: https://and-2yw6.onrender.com/

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
