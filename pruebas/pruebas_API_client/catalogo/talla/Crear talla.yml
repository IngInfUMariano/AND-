info:
  name: Crear talla
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/tallas"
  body:
    type: json
    data: |-
      {
        "codigo": "XXL",
        "descripcion": "Talla Extra Extra Grande",
        "orden": 4
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
