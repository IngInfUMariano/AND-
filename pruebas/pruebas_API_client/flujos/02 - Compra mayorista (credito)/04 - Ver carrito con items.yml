info:
  name: "04 - Ver carrito con items"
  type: http
  seq: 4

# PASO 4
# Confirmar los items y el total del carrito antes de hacer checkout.
# El total debe ser menor o igual al crédito disponible del paso 2.

http:
  method: GET
  url: "{{base_url}}api/carrito"
  auth:
    type: bearer
    token: "{{token_mayorista}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
