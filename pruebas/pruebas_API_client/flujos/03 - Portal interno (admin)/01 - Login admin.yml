info:
  name: 01 - Login admin
  type: http
  seq: 1

# FLUJO PORTAL INTERNO — PASO 1
# Obtener token de sesión del administrador.
# Después de ejecutar: copiar "token" y pegarlo en token_admin del environment.

http:
  method: POST
  url: "{{base_url}}api/auth/interno"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@inventa.gt",
        "password": "Admin123!"
      }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
