info:
  name: 04 - Cliente accede a pedido ajeno (403)
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}api/pedidos/{{pedido_mayorista_id}}"
  auth:
    type: bearer
    token: "{{token_tienda}}"

runtime:
