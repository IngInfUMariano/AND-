info:
  name: 06 - Pedido finalizado no modificable (400)
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{base_url}}api/pedidos/{{pedido_id}}/estado"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "estado": "DESPACHADO",
        "observacion": "Intento de modificar pedido cerrado"
      }
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  variables:
    - name: pedido_id
      value: "9"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
