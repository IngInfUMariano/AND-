info:
  name: Crear mi direccion - campos faltantes
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}api/mis-direcciones"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "alias": "Incompleta"
      }
  auth:
    type: bearer
    token: "{{token_tienda}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
