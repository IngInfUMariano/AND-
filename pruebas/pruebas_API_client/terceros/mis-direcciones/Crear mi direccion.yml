info:
  name: Crear mi direccion
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}api/mis-direcciones"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "alias": "Oficina",
        "destinatario": "Ana Morales",
        "direccion": "6a Calle 3-45, Zona 10",
        "municipio": "Guatemala",
        "departamento": "Guatemala",
        "telefono": "55001234",
        "es_predeterminada": false
      }
  auth:
    type: bearer
    token: "{{token_tienda}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
