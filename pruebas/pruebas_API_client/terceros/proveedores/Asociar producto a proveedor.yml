info:
  name: Asociar producto a proveedor
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}api/proveedores/1/productos"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "producto_id": 1,
        "costo_compra": 85.50,
        "codigo_proveedor": "TS-001",
        "es_principal": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
