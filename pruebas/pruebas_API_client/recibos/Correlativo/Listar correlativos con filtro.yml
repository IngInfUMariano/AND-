info:
  name: Listar correlativos con filtros
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/correlativos?sucursal_id=1&tipo_documento=ENTRADA"
  params:
    - name: sucursal_id
      value: "1"
      type: query
    - name: tipo_documento
      value: ENTRADA
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
