info:
  name: Listar traslados con filtros
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/traslados?estado=EN_TRANSITO&sucursal_origen_id=1"
  params:
    - name: estado
      value: EN_TRANSITO
      type: query
    - name: sucursal_origen_id
      value: "1"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
