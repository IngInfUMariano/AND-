info:
  name: Carga masiva CSV
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/pedidos/masivo"
  body:
    type: multipart-form
    data:
      - name: archivo
        type: file
        value:
          - c:\Users\Coca\AND-\pruebas\pruebas API client\pedidos\pedidos\pedidos_masivo.csv
        contentType: text/csv
  auth:
    type: bearer
    token: "{{token_cliente}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
