info:
  name: Actualizar cantidad de ítem
  type: http
  seq: 1

http:
  method: PUT
  url: "{{base_url}}/api/carrito/items/20"
  body:
    type: json
    data: |-
      {
        "cantidad": 5
      }
  auth:
    type: bearer
    token: "{{token_cliente}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
