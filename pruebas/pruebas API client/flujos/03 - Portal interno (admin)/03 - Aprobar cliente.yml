info:
  name: 03 - Aprobar cliente
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}api/clientes/{{cliente_nuevo_id}}/aprobar"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "limite_credito": 0,
        "plazo_credito_dias": 0
      }
  auth:
    type: bearer
    token: "{{token_admin}}"

runtime:
  variables:
    - name: cliente_nuevo_id
      value: "10"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
