info:
  name: Aprobar cliente mayorista
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}api/clientes/3/aprobar"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "limite_credito": 25000.00,
        "plazo_credito_dias": 30
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
