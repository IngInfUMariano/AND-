info:
  name: Crear variante ya registrada
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/variantes"
  body:
    type: json
    data: |-
      {
        "sku": "POLO-M-AZUL",
        "codigo_barras": "7501234567890",
        "producto_id": 1,
        "talla_id": 1,
        "color_id": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
