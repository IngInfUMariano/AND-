info:
  name: Listar temporada con filtro
  type: http

http:
  method: GET
  url: "{{base_url}}/temporadas?anio=2026&q=Primavera&activo=true"
  params:
    - name: anio
      value: "2026"
      type: query
    - name: q
      value: Primavera
      type: query
    - name: activo
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
