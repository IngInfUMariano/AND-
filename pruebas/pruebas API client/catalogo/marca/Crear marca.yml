info:
  name: Crear marca
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/marcas"
  body:
    type: json
    data: |-
      {
        "nombre":"nike",
        "descripcion": "calzado y ropa deportiva"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
