info:
  name: Actualizar categoria
  type: http
  seq: 1

http:
  method: PUT
  url: "{{base_url}}/categorias/1"
  body:
    type: json
    data: |-
      {
        "nombre": "Invierto",
        "descripcion": "Catálogo completo de equipo de invierno"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: base_url
      value: http://localhost:3000/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
